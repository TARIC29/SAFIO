<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAFIO — Emploi du Temps Intelligent</title>
<style>
:root{
  --bg:#0b1220;--bg-soft:#111a2b;--card:rgba(255,255,255,0.04);--stroke:rgba(255,255,255,0.12);
  --accent:#ff6f3c;--accent-2:#ff8b5e;--text:#eef2ff;--muted:#9aa4b2;
}
body.theme-light{
  --bg:#f4f8ff;--bg-soft:#ffffff;--card:#ffffff;--stroke:#d7e1f5;
  --accent:#2563eb;--accent-2:#3b82f6;--text:#0f172a;--muted:#475569;
}
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%, var(--bg-soft) 0%, var(--bg) 45%);color:var(--text);padding:clamp(12px,2vw,24px);} 
.main{max-width:1200px;margin:0 auto;display:grid;gap:14px;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.topbar a,.theme-btn{color:var(--text);text-decoration:none;background:var(--card);border:1px solid var(--stroke);padding:8px 12px;border-radius:10px}
.app-title{text-align:center;font-size:clamp(1.2rem,2.8vw,2rem);margin:6px 0 2px;}
.subtitle{text-align:center;color:var(--muted);margin:0 0 8px;}
.container{background:var(--card);border:1px solid var(--stroke);padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);} 
h2,h3,h4{margin:0 0 4px;text-align:center;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 14px;align-items:end;}
label{display:block;font-size:.94rem;color:var(--muted);margin-top:2px;}
select,input,button{font-size:.95rem;padding:10px;border-radius:10px;border:1px solid var(--stroke);width:100%;background:var(--bg-soft);color:var(--text);}
button{cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;font-weight:700;}
.actions{display:flex;justify-content:center;}
.table-wrap{width:100%;overflow:auto;border-radius:10px;border:1px solid var(--stroke);} 
table{width:100%;border-collapse:collapse;min-width:840px;background:rgba(255,255,255,0.02);} 
th,td{border:1px solid rgba(127,127,127,.25);padding:8px;text-align:center;word-break:break-word;}
th{position:sticky;top:0;background:var(--bg-soft);z-index:1;}
td.coursFixe{background:#6b7280;color:#fff;font-weight:700;}
td.reposFixe{background:#94a3b8;color:#0f172a;font-weight:600;}
#alertContainer{font-weight:700;color:#ef4444;}
.footer{background:var(--card);border:1px solid var(--stroke);text-align:center;padding:14px;border-radius:12px;}
.footer a{color:var(--accent);text-decoration:none;font-weight:700;}
@media (max-width:768px){.container{padding:12px}th,td{padding:6px;font-size:.83rem;}select,input,button{font-size:.9rem;padding:9px;}}
@media (max-width:480px){body{padding:10px}.container{gap:8px}th,td{padding:5px;font-size:.76rem;}}
</style>
</head>
<body>
<main class="main">
  <div class="topbar">
    <a href="index.html">← Accueil</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  </div>
  <h1 class="app-title">PUFF — Emploi du Temps Intelligent</h1>
  <p class="subtitle">Planification scolaire optimisée, révisions ciblées et équilibre anti-surcharge.</p>

  <section class="container">
    <h3>1️⃣ Choisis ta classe</h3>
    <div class="form-grid">
      <div>
        <label for="classe">Classe</label>
        <select id="classe" onchange="poserQuestions()">
          <option value="">-- Choisir --</option>
          <option>6e</option><option>5e</option><option>4e</option><option>3e</option>
          <option>Seconde</option>
          <option>Première A</option><option>Première C</option><option>Première D</option>
          <option>Terminale A</option><option>Terminale C</option><option>Terminale D</option>
        </select>
      </div>
    </div>
  </section>

  <section id="questionsContainer" class="container"></section>
  <section id="edtScolaireContainer" class="container"></section>
  <section id="alertContainer" class="container"></section>
  <section id="motivationContainer" class="container"></section>
  <section id="statsContainer" class="container"></section>
  <section id="edtPersonnelContainer" class="container table-wrap"></section>

  <div class="actions"><button onclick="telechargerPDF()">Télécharger PDF</button></div>

  <footer class="footer">
    <p>© 2026 <a href="https://socaf.onrender.com" target="_blank" rel="noopener noreferrer">SOCAF TDY INDUSTRIAL</a>. Tous droits réservés.</p>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="puff.js"></script>
<script>
  function applyTheme(theme){
    document.body.classList.toggle('theme-light', theme === 'light');
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = theme === 'light' ? '🌞 Light' : '🌙 Dark';
  }
  function toggleTheme(){
    const next = document.body.classList.contains('theme-light') ? 'dark' : 'light';
    localStorage.setItem('safio-theme', next);
    applyTheme(next);
  }
  applyTheme(localStorage.getItem('safio-theme') || 'dark');
</script>
</body>
</html>
